[project]
name = "vlarlkit-openvla-oft"
version = "0.1.0"
description = "OpenVLA-OFT model backend for VLARLKit"
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26.0,<2.0.0",
    "omegaconf",
    "openvla-oft @ git+https://github.com/moojink/openvla-oft.git@e4287e94541f459edc4feabc4e181f537cd569a8",
    "peft==0.11.1",
    "pillow",
    "setuptools>=68",
    "torch==2.2.0",
    "torchvision==0.17.0",
    "transformers @ git+https://github.com/moojink/transformers-openvla-oft.git@bc339d9ad707454c0c115970db43c260067c61ab",
    "vlarlkit",
    "wandb<0.25.1",
    "wheel",
]

[tool.uv.sources]
vlarlkit = { path = "../..", editable = true }

[tool.uv]
override-dependencies = [
    "torch==2.2.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["vlarlkit_openvla_oft*"]
